<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a3f7a">
<title>赤奈スマホ ロック解除〜HANAトーク</title>
<script>
/* =========================================================
   設定欄（ここだけ書き換えれば表示が変わります）
   【焼肉の女】劇用スマホ 赤奈 ロック画面（10月17日(土)・12:51版）
   ========================================================= */
const CONFIG = {
  // ロック画面に日付・時刻を出すか（true=出す / false=出さない）
  showDateTime: true,
  dateText: '10月17日(土)',
  timeText: '12:51',          // ホーム画面の時計アイコンの針もこの時刻を指す

  passcode: '01281',          // 桁数を変えると丸の数も変わる
  anyKeyUnlock: true,         // true=どの数字を押しても正しいパスコードとして入る

  // 待受画像（同じフォルダに置くと壁紙が差し替わる。置かなければ抽象柄のまま）
  wallpaperImage: 'wallpaper_akana.jpg',

  // パスコード画面の文言
  passTitle: 'パスコードを入力',
  emergencyText: '緊急',
  cancelText: 'キャンセル',
  deleteText: '削除',

  // ホーム画面のウィジェット
  weather: { place: '東京都', temp: '21°', cond: '晴れ時々くもり', high: '最高23°', low: '最低15°' },
  calendar: { weekday: '土曜日', weekdayShort: '土', day: '17', note: '予定なし' },
  searchText: '検索',

  // アプリ（4列×3段）。icon は図柄の種類、name は表示名
  apps: [
    { icon: 'camera',     name: 'カメラ' },
    { icon: 'photos',     name: '写真' },
    { icon: 'calendar',   name: 'カレンダー' },
    { icon: 'clock',      name: '時計' },
    { icon: 'mail',       name: 'メール' },
    { icon: 'memo',       name: 'メモ' },
    { icon: 'map',        name: '地図' },
    { icon: 'weather',    name: '天気' },
    { icon: 'calculator', name: '計算機' },
    { icon: 'health',     name: 'ヘルス' },
    { icon: 'files',      name: 'ファイル' },
    { icon: 'settings',   name: '設定' }
  ],
  // ドック（名前は表示しない）
  dock: [
    { icon: 'phone',   name: '電話' },
    { icon: 'browser', name: 'ブラウザ' },
    { icon: 'message', name: 'メッセージ' },
    { icon: 'music',   name: '音楽' }
  ],

  // タップするとトーク画面が開くアプリ（icon の種類で指定）
  openChatIcon: 'message',

  // 表示する要素（false で非表示）
  show: {
    lockButtons: true,   // ロック画面の懐中電灯・カメラ
    emergency: true,     // パスコード画面の「緊急」
    widgets: true,       // 天気・カレンダー
    appLabels: true,     // アプリ名
    searchButton: true,  // 「検索」
    dock: true           // ドック
  }
};
</script>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--u:1px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000}
html.mobile,html.mobile body,html.mobile #stage{background:#0a2a66}
#phone{position:relative;overflow:hidden;background:#0a3f7a;touch-action:none;width:390px;height:844px}
.layer{position:absolute;inset:0;overflow:hidden}
.wp{position:absolute;inset:0}
.wp svg{width:100%;height:100%;display:block}
.wpimg{position:absolute;inset:0;background-size:cover;background-position:center}
.wp.blur{inset:calc(-40*var(--u));filter:blur(calc(26*var(--u))) saturate(1.15) brightness(.82)}
.dim{position:absolute;inset:0;background:rgba(0,12,34,.26)}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}

/* ---- ロック画面 ---- */
#lock{will-change:transform;cursor:pointer}
#lockText{position:absolute;left:0;right:0;top:calc(max(var(--st),50*var(--u)) + 6*var(--u));text-align:center;pointer-events:none}
.ldate{font-size:calc(21*var(--u));font-weight:600;letter-spacing:.03em;color:rgba(255,255,255,.93);text-shadow:0 calc(1*var(--u)) calc(6*var(--u)) rgba(0,30,80,.28)}
.ltime{font-size:calc(102*var(--u));font-weight:700;line-height:1.02;margin-top:calc(1*var(--u));letter-spacing:calc(-2*var(--u));font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(238,249,255,.88) 50%,rgba(196,233,255,.74) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(1*var(--u)) calc(2*var(--u)) rgba(0,40,100,.35)) drop-shadow(0 calc(2*var(--u)) calc(10*var(--u)) rgba(0,30,80,.25))}
.lbtn{position:absolute;bottom:calc(var(--sb)*.6 + 40*var(--u));width:calc(50*var(--u));height:calc(50*var(--u));border-radius:50%;
  background:rgba(255,255,255,.27);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:inset 0 0 0 calc(.8*var(--u)) rgba(255,255,255,.34),0 calc(2*var(--u)) calc(10*var(--u)) rgba(0,20,60,.15);
  display:flex;align-items:center;justify-content:center;transition:transform .16s,background .16s}
.lbtn.left{left:calc(46*var(--u))}
.lbtn.right{right:calc(46*var(--u))}
.lbtn svg{width:calc(23*var(--u));height:calc(23*var(--u))}
.lbtn svg *{stroke:#fff;transition:stroke .16s}
.lbtn.on{transform:scale(1.16);background:rgba(255,255,255,.42)}
.lbtn.lit{background:rgba(255,255,255,.95)}
.lbtn.lit svg *{stroke:#1b2536}

/* ---- パスコード画面 ---- */
#pass{transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
#pass.out{opacity:0;transform:scale(1.08)}
.ptitle{position:absolute;left:0;right:0;top:calc(var(--st)*.4 + 150*var(--u));text-align:center;font-size:calc(20*var(--u));font-weight:500;letter-spacing:.04em}
.dots{position:absolute;left:0;right:0;top:calc(var(--st)*.4 + 192*var(--u));display:flex;justify-content:center;gap:calc(24*var(--u))}
.dot{width:calc(13*var(--u));height:calc(13*var(--u));border-radius:50%;border:calc(1.4*var(--u)) solid #fff;transition:background .08s}
.dot.f{background:#fff}
.dots.shake{animation:shake .48s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translateX(0)}12%{transform:translateX(calc(-20*var(--u)))}30%{transform:translateX(calc(17*var(--u)))}48%{transform:translateX(calc(-12*var(--u)))}66%{transform:translateX(calc(7*var(--u)))}84%{transform:translateX(calc(-3*var(--u)))}}
.pad{position:absolute;left:50%;top:calc(var(--st)*.4 + 252*var(--u));transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,calc(78*var(--u)));column-gap:calc(26*var(--u));row-gap:calc(16*var(--u))}
.key{width:calc(78*var(--u));height:calc(78*var(--u));border-radius:50%;background:rgba(255,255,255,.2);
  box-shadow:inset 0 0 0 calc(.7*var(--u)) rgba(255,255,255,.2),inset 0 calc(1*var(--u)) calc(1*var(--u)) rgba(255,255,255,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s}
.key.on{background:rgba(255,255,255,.62);transition:none}
.key .n{font-size:calc(37*var(--u));font-weight:400;line-height:1}
.key .l{font-size:calc(9.5*var(--u));font-weight:700;letter-spacing:calc(1.8*var(--u));height:calc(12*var(--u));line-height:calc(12*var(--u));margin-top:calc(1*var(--u));padding-left:calc(1.8*var(--u))}
.key.z{grid-column:2}
.pbtm{position:absolute;bottom:calc(var(--sb)*.6 + 40*var(--u));font-size:calc(17*var(--u));padding:calc(8*var(--u));transition:opacity .15s}
.pbtm:active{opacity:.5}
.pbtm.l{left:calc(42*var(--u))}
.pbtm.r{right:calc(42*var(--u))}

/* ---- ホーム画面 ---- */
#home{visibility:hidden}
#home.show{visibility:visible}
#home .wp{transform:scale(1.1);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
#home.show .wp{transform:none}
.pop{opacity:0}
#home.show .pop{animation:emerge .64s cubic-bezier(.18,.9,.28,1.06) both;animation-delay:var(--d,0s)}
@keyframes emerge{0%{opacity:0;transform:scale(.42);filter:blur(calc(3*var(--u)))}55%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
.fade{opacity:0}
#home.show .fade{animation:fadein .5s ease both;animation-delay:.12s}
@keyframes fadein{to{opacity:1}}

.widgets{position:absolute;left:calc(22*var(--u));right:calc(22*var(--u));top:calc(max(var(--st),50*var(--u)) + 14*var(--u));display:flex;justify-content:space-between}
.widget{width:calc(165*var(--u));height:calc(165*var(--u));border-radius:calc(24*var(--u));padding:calc(15*var(--u)) calc(16*var(--u));position:relative;overflow:hidden;
  box-shadow:0 calc(4*var(--u)) calc(14*var(--u)) rgba(0,20,60,.25)}
.w-weather{background:linear-gradient(170deg,#4a9cf0 0%,#2a6fd0 60%,#1f5cbc 100%)}
.w-weather::after,.w-cal::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%);pointer-events:none}
.ww-place{font-size:calc(15*var(--u));font-weight:600}
.ww-temp{font-size:calc(48*var(--u));font-weight:300;line-height:1.05;margin-top:calc(1*var(--u))}
.ww-bottom{position:absolute;left:calc(16*var(--u));right:calc(12*var(--u));bottom:calc(14*var(--u))}
.ww-ico{width:calc(24*var(--u));height:calc(24*var(--u));display:block;margin-bottom:calc(3*var(--u))}
.ww-cond{font-size:calc(13*var(--u));font-weight:600;white-space:nowrap}
.ww-hl{font-size:calc(12.5*var(--u));font-weight:500;margin-top:calc(1*var(--u));white-space:nowrap}
.w-cal{background:#fff;color:#1b1f27}
.wc-wd{font-size:calc(13*var(--u));font-weight:700;color:#e8583d;letter-spacing:.04em}
.wc-day{font-size:calc(52*var(--u));font-weight:400;line-height:1.05}
.wc-note{position:absolute;left:calc(16*var(--u));bottom:calc(16*var(--u));font-size:calc(13*var(--u));color:#8a909a;font-weight:500}

.grid{position:absolute;left:calc(13*var(--u));right:calc(13*var(--u));top:calc(max(var(--st),50*var(--u)) + 207*var(--u));display:grid;grid-template-columns:repeat(4,1fr);row-gap:calc(20*var(--u))}
.app{display:flex;flex-direction:column;align-items:center}
.ico{width:calc(62*var(--u));height:calc(62*var(--u));border-radius:calc(15*var(--u));position:relative;overflow:hidden;flex:none;
  box-shadow:0 calc(3*var(--u)) calc(8*var(--u)) rgba(0,15,45,.32),inset 0 calc(-1.5*var(--u)) 0 rgba(0,0,0,.12),inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.35)}
.ico::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.07) 46%,rgba(255,255,255,0) 54%,rgba(0,0,0,.09) 100%)}
.ico svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 calc(1*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.24))}
.ico.flat svg{filter:none}
.app span{margin-top:calc(6*var(--u));font-size:calc(11.5*var(--u));font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}

.searchWrap{position:absolute;left:0;right:0;bottom:calc(var(--sb)*.35 + 124*var(--u));display:flex;justify-content:center}
.search{display:flex;align-items:center;gap:calc(5*var(--u));padding:calc(6*var(--u)) calc(14*var(--u));border-radius:calc(20*var(--u));font-size:calc(13*var(--u));font-weight:600;
  background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 calc(.7*var(--u)) rgba(255,255,255,.25)}
.search svg{width:calc(13*var(--u));height:calc(13*var(--u))}
.dock{position:absolute;left:calc(12*var(--u));right:calc(12*var(--u));bottom:calc(var(--sb)*.35 + 12*var(--u));height:calc(92*var(--u));border-radius:calc(34*var(--u));
  background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:inset 0 0 0 calc(.8*var(--u)) rgba(255,255,255,.28)}
.dockIcons{position:absolute;left:calc(12*var(--u));right:calc(12*var(--u));bottom:calc(var(--sb)*.35 + 12*var(--u));height:calc(92*var(--u));display:flex;justify-content:space-around;align-items:center;padding:0 calc(8*var(--u))}

/* ---- トーク画面（メッセージアプリ） ---- */
#chat{visibility:hidden;opacity:0;transform:scale(.18);transform-origin:50% 90%;background:#9eadd7;border-radius:calc(40*var(--u));
  transition:transform .46s cubic-bezier(.2,.85,.25,1),opacity .2s ease,border-radius .46s ease;z-index:5}
#chat.show{visibility:visible;opacity:1;transform:none;border-radius:0}
#chat iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#9eadd7}
.app[data-open]{cursor:pointer}
.app[data-open]:active .ico{filter:brightness(.75)}
.sa-probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="home" class="layer">
      <div class="wp" data-grain="1"></div>
      <div id="homeUI"></div>
    </div>
    <div id="pass" class="layer">
      <div class="wp blur"></div>
      <div class="dim"></div>
      <div id="passUI"></div>
    </div>
    <div id="chat" class="layer"></div>
    <div id="lock" class="layer">
      <div class="wp" data-grain="1"></div>
      <div id="lockText"></div>
      <button class="lbtn left" id="btnLight" aria-label="light">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v3l-2 4v10.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L8 6z"/><path d="M8 6h8"/><path d="M12 13.2v1.8"/></svg>
      </button>
      <button class="lbtn right" id="btnCam" aria-label="camera">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="7" width="18.4" height="13" rx="3"/><path d="M8.3 7l1.6-2.6h4.2L15.7 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
(function(){
const $ = s => document.querySelector(s);
const phone = $('#phone'), lock = $('#lock'), pass = $('#pass'), home = $('#home');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 画面サイズ ---------- */
const mobile = matchMedia('(pointer: coarse)').matches;
if (mobile) document.documentElement.classList.add('mobile');
function fit(){
  const st = $('#stage'); let w, h;
  if (mobile) { w = st.clientWidth; h = st.clientHeight; }
  else { const W = st.clientWidth, H = st.clientHeight; w = Math.min(W, H*390/844); h = w*844/390; }
  phone.style.width = w + 'px'; phone.style.height = h + 'px';
  phone.style.setProperty('--u', (w/390) + 'px');
}
fit(); addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

/* ---------- 壁紙（オリジナルの抽象柄） ---------- */
let wpCount = 0;
function wallSVG(grain){
  const p = 'w' + (wpCount++) + '_';
  const edges = [
    'M-40 235 C 90 125 260 385 430 205',
    'M-40 385 C 120 250 250 470 430 330',
    'M-40 565 C 140 690 250 470 430 605',
    'M-40 765 C 120 660 290 860 430 720'
  ];
  const fills = ['a','b','c','d'];
  let shapes = '';
  edges.forEach((e,i) => {
    shapes += `<path d="${e}" transform="translate(0,-7)" fill="none" stroke="#021a42" stroke-opacity=".32" stroke-width="16" filter="url(#${p}soft)"/>`;
    shapes += `<path d="${e} L430 900 L-40 900 Z" fill="url(#${p}${fills[i]})"/>`;
    shapes += `<path d="${e} L430 900 L-40 900 Z" fill="url(#${p}sheen${i})"/>`;
    shapes += `<path d="${e}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="7" filter="url(#${p}glow)"/>`;
    shapes += `<path d="${e}" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2"/>`;
  });
  const sheenY = [[125,385],[250,470],[470,690],[660,860]];
  const sheens = sheenY.map((y,i)=>`<linearGradient id="${p}sheen${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${y[0]}" x2="0" y2="${y[1]}"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#001030" stop-opacity=".12"/></linearGradient>`).join('');
  return `<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="${p}bg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#0a3f7a"/><stop offset=".55" stop-color="#0b5e8e"/><stop offset="1" stop-color="#0a2a66"/></linearGradient>
<linearGradient id="${p}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4f3ff"/><stop offset=".5" stop-color="#7bd6f2"/><stop offset="1" stop-color="#38acd8"/></linearGradient>
<linearGradient id="${p}b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd2c8"/><stop offset=".6" stop-color="#139aa6"/><stop offset="1" stop-color="#0b6f8f"/></linearGradient>
<linearGradient id="${p}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f86ee"/><stop offset=".6" stop-color="#1f56c8"/><stop offset="1" stop-color="#14389a"/></linearGradient>
<linearGradient id="${p}d" x1="0" y1="0" x2="1" y2=".6"><stop offset="0" stop-color="#5fe0e6"/><stop offset="1" stop-color="#2a8fe0"/></linearGradient>
<radialGradient id="${p}lt" cx=".7" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
${sheens}
<filter id="${p}glow" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="${p}soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
${grain ? `<filter id="${p}n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>` : ''}
</defs>
<rect width="390" height="844" fill="url(#${p}bg)"/>
${shapes}
<rect width="390" height="844" fill="url(#${p}lt)"/>
${grain ? `<rect width="390" height="844" filter="url(#${p}n)" opacity=".16" style="mix-blend-mode:overlay"/>` : ''}
</svg>`;
}
document.querySelectorAll('.wp').forEach(w => { w.innerHTML = wallSVG(w.dataset.grain === '1'); });
if (CONFIG.wallpaperImage) {
  const im = new Image();
  im.onload = () => document.querySelectorAll('.wp').forEach(w => {
    w.innerHTML = '<div class="wpimg"></div>';
    w.firstChild.style.backgroundImage = 'url("' + CONFIG.wallpaperImage + '")';
  });
  im.src = CONFIG.wallpaperImage;
}

/* ---------- ロック画面の文字 ---------- */
if (CONFIG.showDateTime) {
  $('#lockText').innerHTML = `<div class="ldate">${esc(CONFIG.dateText)}</div><div class="ltime">${esc(CONFIG.timeText)}</div>`;
}
if (!CONFIG.show.lockButtons) { $('#btnLight').style.display = 'none'; $('#btnCam').style.display = 'none'; }

/* ---------- アイコン（すべてオリジナル図形） ---------- */
const [hh, mm] = String(CONFIG.timeText).split(':').map(Number);
function clockGlyph(){
  let s = '<circle cx="30" cy="30" r="23" fill="#f6f7f9"/>';
  for (let i = 0; i < 12; i++) {
    const a = i*Math.PI/6, big = i%3 === 0;
    const r1 = 20, r2 = big ? 16.5 : 18;
    s += `<line x1="${30+Math.sin(a)*r1}" y1="${30-Math.cos(a)*r1}" x2="${30+Math.sin(a)*r2}" y2="${30-Math.cos(a)*r2}" stroke="${big?'#2a2f38':'#a3a9b2'}" stroke-width="${big?2:1.3}" stroke-linecap="round"/>`;
  }
  const ha = ((hh%12) + mm/60) * 30 * Math.PI/180, ma = mm*6*Math.PI/180;

const LEN = String(CONFIG.passcode).length;
const LETTERS = {1:'',2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ',0:''};
(function buildPass(){
  let h = `<div class="ptitle">${esc(CONFIG.passTitle)}</div><div class="dots" id="dots">`;
  for (let i = 0; i < LEN; i++) h += '<div class="dot"></div>';
  h += '</div><div class="pad">';
  [1,2,3,4,5,6,7,8,9,0].forEach(n => {
    h += `<button class="key${n===0?' z':''}" data-d="${n}"><span class="n">${n}</span><span class="l">${LETTERS[n]}</span></button>`;
  });
  h += '</div>';
  if (CONFIG.show.emergency) h += `<button class="pbtm l" id="btnEm">${esc(CONFIG.emergencyText)}</button>`;
  h += `<button class="pbtm r" id="btnCancel">${esc(CONFIG.cancelText)}</button>`;
  $('#passUI').innerHTML = h;
})();
const dotsEl = $('#dots'), dotEls = [...dotsEl.children], cancelBtn = $('#btnCancel');
const keyEls = {}; document.querySelectorAll('.key').forEach(k => keyEls[k.dataset.d] = k);

/* ---------- 状態 ---------- */
let state = 'lock', entered = '', busy = false, gen = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
function flash(el){ if (!el) return; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 150); }
function updateDots(){
  dotEls.forEach((d,i) => d.classList.toggle('f', i < entered.length));
  cancelBtn.textContent = entered.length ? CONFIG.deleteText : CONFIG.cancelText;
}

function openPass(){
  if (state !== 'lock' || busy) return Promise.resolve();
  busy = true;
  lock.style.transition = 'transform .42s cubic-bezier(.3,.7,.2,1)';
  lock.style.transform = `translateY(${-phone.clientHeight}px)`;
  return wait(430).then(() => { lock.style.visibility = 'hidden'; state = 'pass'; busy = false; });
}
function closePass(){
  if (state !== 'pass' || busy) return;
  busy = true; entered = ''; updateDots();
  lock.style.visibility = ''; lock.style.transition = 'none';
  lock.style.transform = `translateY(${-phone.clientHeight}px)`;
  lock.offsetHeight;
  lock.style.transition = 'transform .4s cubic-bezier(.3,.7,.2,1)';
  lock.style.transform = '';
  setTimeout(() => { state = 'lock'; busy = false; }, 410);
}
function press(d){
  if (state !== 'pass' || busy || entered.length >= LEN) return;
  flash(keyEls[d]);
  if (CONFIG.anyKeyUnlock) d = String(CONFIG.passcode)[entered.length];
  entered += d; updateDots();
  if (entered.length === LEN) { busy = true; setTimeout(check, 160); }
}
function del(){
  if (state !== 'pass' || busy) return;
  if (entered.length) { entered = entered.slice(0,-1); updateDots(); } else closePass();
}
function check(){
  const g = gen;
  if (entered === String(CONFIG.passcode)) { unlock(); return; }
  dotsEl.classList.remove('shake'); dotsEl.offsetWidth; dotsEl.classList.add('shake');
  setTimeout(() => { if (g !== gen) return; entered = ''; updateDots(); dotsEl.classList.remove('shake'); busy = false; }, 500);
}
function unlock(){
  state = 'home';
  const pr = phone.getBoundingClientRect(), cx = pr.left + pr.width/2, cy = pr.top + pr.height/2;
  const els = [...home.querySelectorAll('.pop')];
  const ds = els.map(el => { const r = el.getBoundingClientRect(); return Math.hypot(r.left + r.width/2 - cx, r.top + r.height/2 - cy); });
  const max = Math.max(1, ...ds);
  els.forEach((el,i) => el.style.setProperty('--d', (0.06 + ds[i]/max*0.34).toFixed(3) + 's'));
  home.classList.add('show');
  pass.classList.add('out');
  const g = gen;
  setTimeout(() => { if (g !== gen) return; pass.style.visibility = 'hidden'; busy = false; }, 600);
}
function reset(){
  gen++; state = 'lock'; entered = ''; busy = false; updateDots();
  dotsEl.classList.remove('shake');
  home.classList.remove('show');
  pass.classList.remove('out'); pass.style.visibility = '';
  lock.style.transition = 'none'; lock.style.transform = ''; lock.style.visibility = '';
  $('#btnLight').classList.remove('lit');
  closeChat(true);
}
async function autoPlay(){
  if (state === 'home') { openChat(); return; }
  const g = ++gen;
  if (state === 'lock') { await openPass(); if (g !== gen) return; await wait(380); }
  while (busy) { await wait(50); if (g !== gen) return; }
  if (entered.length) { entered = ''; updateDots(); }
  for (const d of String(CONFIG.passcode)) {
    await wait(260); if (g !== gen) return;
    press(d);
  }
}

/* ---------- ロック画面の操作（タップ／上スワイプ） ---------- */
let drag = null;
lock.addEventListener('pointerdown', e => {
  if (state !== 'lock' || busy) return;
  drag = { y: e.clientY, t: performance.now(), dy: 0 };
  try { lock.setPointerCapture(e.pointerId); } catch(_){}
  lock.style.transition = 'none';
});
lock.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dy = Math.max(0, drag.y - e.clientY);
  lock.style.transform = `translateY(${-drag.dy}px)`;
});
function endDrag(){
  if (!drag) return;
  const dt = Math.max(1, performance.now() - drag.t), dy = drag.dy, v = dy/dt;
  drag = null;
  if (dy < 8 || dy > phone.clientHeight*0.16 || v > 0.45) openPass();
  else { lock.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)'; lock.style.transform = ''; }
}
lock.addEventListener('pointerup', endDrag);
lock.addEventListener('pointercancel', endDrag);

// 懐中電灯・カメラ（押すと反応するだけ。懐中電灯は点灯表示を切り替え）
['#btnLight','#btnCam'].forEach(id => {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.stopPropagation(); b.classList.add('on'); });
  const up = e => { e.stopPropagation(); if (!b.classList.contains('on')) return; b.classList.remove('on'); if (id === '#btnLight') b.classList.toggle('lit'); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', () => b.classList.remove('on'));
  b.addEventListener('pointercancel', () => b.classList.remove('on'));
});

const chatEl = $('#chat');
let chatFrame = null;
function chatSrc(){
  const bin = atob(CHAT_B64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  let html = new TextDecoder('utf-8').decode(u8);
  const pr = document.createElement('div'); pr.className = 'sa-probe'; document.body.appendChild(pr);
  const cs = getComputedStyle(pr), st = cs.paddingTop || '0px', sb = cs.paddingBottom || '0px'; pr.remove();
  return html.replace('<head>', `<head><style>:root{--psat:${st};--psab:${sb}}</style>`);
}
function buildChat(){
  chatFrame = document.createElement('iframe');
  chatFrame.setAttribute('title','トーク');
  chatFrame.srcdoc = chatSrc();
  chatFrame.addEventListener('load', () => {
    try {
      const d = chatFrame.contentDocument;
      const back = d.querySelector('.back');
      if (back) { back.style.cursor = 'pointer'; back.addEventListener('click', () => closeChat()); }
      d.addEventListener('keydown', e => {
        const k = e.key;
        if (k === 'r' || k === 'R') { e.preventDefault(); reset(); }
        else if (k === 'Escape' || k === 'b' || k === 'B') { e.preventDefault(); closeChat(); }
      });
    } catch(_){}
  });
  chatEl.appendChild(chatFrame);
}
buildChat();
function openChat(fromEl){
  if (state !== 'home' || chatEl.classList.contains('show')) return;
  const el = fromEl || home.querySelector('.app[data-open]');
  if (el) {
    const pr = phone.getBoundingClientRect(), r = el.querySelector('.ico').getBoundingClientRect();
    chatEl.style.transformOrigin = `${((r.left + r.width/2 - pr.left)/pr.width*100).toFixed(1)}% ${((r.top + r.height/2 - pr.top)/pr.height*100).toFixed(1)}%`;
  }
  chatEl.classList.add('show');
  state = 'chat';
  setTimeout(() => {
    try {
      chatFrame.contentWindow.dispatchEvent(new Event('resize'));
      const t = chatFrame.contentDocument.getElementById('talk'); if (t) t.scrollTop = t.scrollHeight;
      chatFrame.contentWindow.focus();
    } catch(_){}
  }, 60);
}
function closeChat(instant){
  if (instant) { chatEl.style.transition = 'none'; chatEl.classList.remove('show'); chatEl.offsetHeight; chatEl.style.transition = ''; return; }
  if (!chatEl.classList.contains('show')) return;
  chatEl.classList.remove('show');
  state = 'home';
  window.focus();
}
home.addEventListener('click', e => {
  const a = e.target.closest('.app[data-open]');
  if (a) openChat(a);
});

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key, c = e.code;
  if (k === 'a' || k === 'A' || c === 'KeyA') { e.preventDefault(); autoPlay(); return; }
  if (k === 'r' || k === 'R' || c === 'KeyR') { e.preventDefault(); reset(); return; }
  let d = null;
  if (/^[0-9]$/.test(k)) d = k;
  else if (/^[０-９]$/.test(k)) d = String(k.charCodeAt(0) - 0xFF10);
  else { const m = /^(Digit|Numpad)([0-9])$/.exec(c); if (m) d = m[2]; }
  if (d !== null) { e.preventDefault(); press(d); return; }
  if (k === 'Backspace' || c === 'Backspace') { e.preventDefault(); if (state === 'pass' && entered.length) del(); return; }
  if (k === 'm' || k === 'M' || c === 'KeyM') { e.preventDefault(); openChat(); return; }
  if (k === 'b' || k === 'B' || c === 'KeyB') { e.preventDefault(); if (state === 'chat') closeChat(); return; }
  if (k === 'Escape') { if (state === 'pass') { entered = ''; closePass(); } else if (state === 'chat') closeChat(); }
});
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
